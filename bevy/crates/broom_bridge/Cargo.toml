[package]
name = "broom_bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Live link between the BevyBroom editor and a Bevy game, rendered with DynLight by default"

[dependencies]
bevy.workspace = true
dynlight = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
base64 = "0.23"
ron = "0.12"

[dev-dependencies]
# The examples open a window.
bevy = { workspace = true, features = ["bevy_winit", "x11", "wayland"] }

[features]
default = ["dynlight"]
# Authored lights, rooms, portals, shipped lights, preview bakes and DynLit catalog materials.
dynlight = ["dep:dynlight"]
