name: CI and desktop artifacts

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bevybroom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run testrun

      # Embed the same CI version into package.json before the web production build so
      # GitHub Pages shows "Version: 1.<run>.0" instead of the repo placeholder 1.0.0.
      - name: Assign application version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts --write)"
          echo "Web release version: ${VERSION}"

      - name: Build web bundle
        run: bun run build

      # Favicons live in public/ and are copied into docs/ by Vite on every
      # build (relative links in index.html / site.webmanifest). No restore step.

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Run strict TypeScript check
        run: bun run typecheck:strict

  bevy-workspace:
    name: Bevy workspace (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: AiWorldEd

      - name: Read the pinned renderer commit
        id: pin
        shell: bash
        run: |
          echo "renderer_repository=$(jq -r '.renderer.repository' AiWorldEd/compatibility.json | sed 's#https://github.com/##')" >> "$GITHUB_OUTPUT"
          echo "renderer_commit=$(jq -r '.renderer.commit' AiWorldEd/compatibility.json)" >> "$GITHUB_OUTPUT"

      # bevy/Cargo.toml reaches the renderer at ../../DynLightBevy.
      - name: Check out the renderer at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.renderer_repository }}
          ref: ${{ steps.pin.outputs.renderer_commit }}
          path: DynLightBevy

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: AiWorldEd/bevy

      - name: Check formatting
        working-directory: AiWorldEd/bevy
        run: cargo fmt --all --check

      - name: Run clippy
        working-directory: AiWorldEd/bevy
        run: cargo clippy --workspace --all-targets -j 2 -- -D warnings

      - name: Run tests
        working-directory: AiWorldEd/bevy
        run: cargo test --workspace -j 2

  desktop-build:
    name: Build ${{ matrix.platform }} desktop artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Embed 1.<run_number>.0 into package.json before Electrobun packages the app.
      - name: Assign desktop release version
        id: version
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts --write)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Desktop release version: ${VERSION}"

      # The first Electrobun 2.x command downloads Hutch and projects the SDK
      # into .hutch/devkit; the preBuild script then builds the desktop page.
      - name: Build Electrobun package
        run: bun run desktop:build

      # Versioned Setup for humans + Electrobun-named portable/update.json for auto-update.
      - name: Package clean release assets
        shell: bash
        run: |
          bun scripts/package_desktop_release.ts \
            --version "${{ steps.version.outputs.version }}" \
            --input desktop_artifacts \
            --output release_dist

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: bevybroom-${{ matrix.platform }}-${{ github.sha }}
          path: release_dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Automatic Release
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(bun scripts/ci_release_version.ts)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bevybroom-*
          path: release_assets/
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        run: |
          bun scripts/compose_release_notes.ts \
            --version "${{ steps.version.outputs.version }}" \
            --assets release_assets \
            --sha "${{ github.sha }}" \
            --out release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'BevyBroom v${{ steps.version.outputs.version }}'
          body_path: release_body.md
          files: release_assets/**/*
          generate_release_notes: false

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
